# Bundled defaults. The user config keeps only what differs from these.
version = 2

[plugins.shape]
order = [
    "bundled.deleted-bodies",
    "bundled.summarize",
    "bundled.test-bodies",
    "bundled.removed-runs",
    "bundled.context",
]

[plugins.shape.bundled.context]
enabled = true
lines = 3

[plugins.shape.bundled.deleted-bodies]
enabled = true
min_lines = 12

[plugins.shape.bundled.removed-runs]
enabled = true
min_lines = 5

[plugins.shape.bundled.summarize]
enabled = false
provider = "gemini"
min_lines = 20
tests = true
test_min_lines = 20
request_timeout_ms = 60000
retries = 3

[plugins.shape.bundled.test-bodies]
enabled = true
min_lines = 3

[theme]
name = "default-dark"

[diff]
byte_limit = 1000000
graph_limit = 3000000
parse_error_limit = 0
