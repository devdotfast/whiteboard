[package]
workspace = "../../../plugins/workspace"
name = "concurrent-guest-probe"
version = "0.0.0"
edition = "2021"
rust-version = "1.95.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.62.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
wasip3 = { version = "0.9.0", features = ["http-compat"] }
http = "1"
http-body-util = "0.1"
bytes = "1"

[dev-dependencies]
futures = "0.3"
