[package]
name = "diffr-cli"
description = "Structural diffs with a streaming API and interactive terminal frontend."
repository = "https://github.com/devdotfast/whiteboard"
homepage = "https://github.com/devdotfast/whiteboard/tree/main/diffr"
license = "MIT"
version = "0.1.17"
authors = ["dev.fast"]
keywords = ["diff", "syntax"]
categories = ["development-tools", "command-line-utilities", "parser-implementations"]
edition = "2021"
# Wasmtime 49 requires at least Rust 1.96.
rust-version = "1.99.0"

include = [
        "/build.rs",
        "/docs/agents.md",
        "/docs/plugin.md",
        "/src/",
        "/wit/",
        "/plugins/",
        "/vendored_parsers/highlights/*.scm",
        "/vendored_parsers/*-src/**/*.c",
        "/vendored_parsers/*-src/**/*.h",
        "/LICENSE",
        "/NOTICE",
        "/README.md",
]

[dependencies]
diffr-core = { path = "crates/diffr-core", version = "0.1.17" }
gix = { version = "0.88", default-features = false, features = ["parallel", "revision", "status", "blob-diff", "attributes", "sha1"] }
clap = { version = "4.0.0", features = ["cargo", "derive", "env", "wrap_help", "string"] }
typed-arena = "2.0.2"
libc = "0.2.108"
log = "0.4.14"
pretty_env_logger = "0.5.0"

rayon = "1.7.0"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "sync", "io-util", "macros"] }

terminal_size = "0.4.1"
glob = "0.3.2"
strum = { version = "0.28", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
toml = { version = "0.8", default-features = false, features = ["display", "parse"] }
# WASM component plugins, with component concurrency available for the runtime redesign.
wasmtime = { version = "49.0.2", default-features = false, features = ["runtime", "cranelift", "component-model", "component-model-async", "anyhow", "cache", "parallel-compilation", "std"] }
wasmtime-wasi = { version = "49.0.2", default-features = false, features = ["p2", "p3"] }
# The byte buffer a guest's output stream is handed, wasmtime-wasi's own.
bytes = "1.12"
wasmtime-wasi-http = { version = "49.0.2", default-features = false, features = ["p2", "p3", "default-send-request"] }
cliclack = "0.5.6"
dirs = "5"


[target.'cfg(not(any(windows, target_os = "illumos", target_os = "freebsd")))'.dependencies]
tikv-jemallocator = "0.7"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
diffr-core = { path = "crates/diffr-core", features = ["test-support"] }
assert_cmd = "2.0.17"
predicates = "3.1.3"

tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "net", "process"] }

[build-dependencies]
version_check = "0.9.4"

[workspace]
members = ["xtask", "crates/diffr-core", "crates/diffr-grammars", "crates/diffr-plugin-sdk"]
default-members = [".", "crates/diffr-core", "crates/diffr-grammars", "crates/diffr-plugin-sdk"]
exclude = ["plugins", "tests/fixtures/concurrent-guest"]

[profile.release]
lto = "thin"

# Grammar generation parses and compresses large C tables at build time.
[profile.dev.build-override]
opt-level = 2

# Speed up WASM compilation in tests without changing diffr's debug settings.
[profile.dev.package.cranelift-codegen]
opt-level = 2

[profile.dev.package.regalloc2]
opt-level = 2

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 2

[[bin]]
name = "diffr"
path = "src/main.rs"

[package.metadata.binstall]
# Encode the slash in diffr/X.Y.Z tags; binaries sit at the archive root.
pkg-url = "{ repo }/releases/download/diffr%2F{ version }/diffr-{ version }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.deb]
depends = "$auto"
section = "utility"
priority = "optional"
assets = [
	"$auto",
	[ "diffr.1", "usr/share/man/man1/", "644" ],
	[ "CHANGELOG.md", "usr/share/doc/difftastic/", "644" ],
]

[[bench]]
name = "engine"
path = "benches/engine.rs"
harness = false
