name = "classify"
title = "Classify"
description = "Tag each changed file as generated, vendored, docs, test, integration or e2e from GitHub Linguist's rules, diffr's test-path rules and git attributes."

[options.hide]
type = "array"
items = { type = "string" }
title = "Tags that hide a file"
description = "A file carrying any of these tags starts hidden: it is diffed by line, no shape plugin runs on it, and it is shown collapsed. The first listed tag a file carries names the reason."
default = ["generated", "vendored"]

[options.hide_deleted]
type = "boolean"
title = "Hide deleted files"
description = "Hide files that were deleted outright, whatever their tags."
default = true
