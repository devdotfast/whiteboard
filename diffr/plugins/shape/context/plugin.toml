name = "context"
title = "Context"
description = "Fold each unchanged stretch into one row, keeping `lines` around every change and the headers of the syntax that encloses it. An unchanged fold is hidden whole."

[enabled]
title = "Collapse unchanged lines"
description = "Collapse unchanged lines that are neither near a change nor the header of the function, type or block a change sits in."

[options.lines]
type = "integer"
minimum = 0
maximum = 4294967295
title = "Context lines"
description = "Unchanged lines kept visible on either side of a change. `-U` overrides it for one run."
default = 3

