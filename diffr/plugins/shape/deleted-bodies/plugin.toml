name = "deleted-bodies"
title = "Deleted function bodies"
description = "Collapse function bodies that were deleted: nothing under the fold has a counterpart on the after side."

[enabled]
title = "Collapse deleted function bodies"
description = "Collapse deleted function bodies, keeping their header line visible."

[options.min_lines]
type = "integer"
minimum = 0
title = "Shortest body to collapse (lines)"
description = "Deleted bodies shorter than this stay open."
default = 12

# The fold queries for each language, as files in this folder.
[queries]
rust = "queries/rust.scm"
python = "queries/python.scm"
go = "queries/go.scm"
javascript = "queries/javascript.scm"
javascriptjsx = "queries/jsx.scm"
typescript = "queries/typescript.scm"
typescripttsx = "queries/tsx.scm"
