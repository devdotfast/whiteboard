[package]
workspace = "../../../workspace"
publish = false
name = "diffr-plugin-summarize"
description = "The summarize plugin: pseudocode summaries for large new function bodies."
version = "0.1.1"
edition = "2021"
rust-version = "1.87.0"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0"
diffr-plugin-sdk = { path = "../../../../crates/diffr-plugin-sdk", version = "0.1.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

wasip3 = { version = "0.9.0", features = ["http-compat"] }
http = "1"
http-body-util = "0.1"
bytes = "1"

