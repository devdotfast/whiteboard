[package]
workspace = "../../../workspace"
publish = false
name = "diffr-plugin-summarize"
description = "The summarize plugin: pseudocode summaries for large new function bodies."
version = "0.1.1"
edition = "2021"
rust-version = "1.87.0"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
diffr-plugin-sdk = { path = "../../../../crates/diffr-plugin-sdk", version = "0.3.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# The component calls models through wasi:http.
[target.'cfg(target_os = "wasi")'.dependencies]
wasip3 = { version = "0.9.0", features = ["http-compat"] }
http = "1"
http-body-util = "0.1"
bytes = "1"

# Linked into a host (diffr in the browser), it calls through the host's HTTP.
[target.'cfg(not(target_os = "wasi"))'.dependencies]
diffr-plugin-sdk = { path = "../../../../crates/diffr-plugin-sdk", version = "0.1.1", features = ["native"] }

