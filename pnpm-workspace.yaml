packages:
  - "packages/*"
  - "packages/agent-plugins/pi"
  - "packages/review/app"
  - "apps/*"

catalog:
  zod: "4.6.5"

catalogMode: strict

nodeLinker: hoisted
enableGlobalVirtualStore: true
strictPeerDependencies: false
autoInstallPeers: false
verifyDepsBeforeRun: false
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@dev.fast/diffr@0.1.10"
  # Ask tracks the latest ACP SDK and adapters, and the CLI packages they pin.
  - "@agentclientprotocol/sdk@1.5.1"
  - "@agentclientprotocol/claude-agent-acp@0.84.0"
  - "@agentclientprotocol/codex-acp@2.0.0"
  - "@anthropic-ai/claude-agent-sdk@0.3.284"
  - "@openai/codex@0.158.0"
  - "pi-acp@0.0.34"

overrides:
  # @dev.fast/whiteboard declares a registry range; this override is what makes
  # it resolve to the workspace package. Do not remove it.
  "@dev.fast/local-vcs": "workspace:0.1.0"
  esbuild: "0.28.1"
  hono: "4.13.5"
  postcss: "8.5.23"
  undici: "7.29.0"
  vite: "8.0.16"

# Ask runs the user's own `claude` and `codex` (CLAUDE_CODE_EXECUTABLE and
# CODEX_PATH), so the ACP adapters never need their bundled platform CLIs.
ignoredOptionalDependencies:
  - "@anthropic-ai/claude-agent-sdk-*"
  - "@openai/codex-*"
  # Native libvips conflicts with Linux Electron; use Sharp's WASM fallback.
  - "@img/sharp-linux*"
  - "@img/sharp-libvips-linux*"

allowBuilds:
  esbuild: true
