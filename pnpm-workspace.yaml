packages:
  - "packages/*"
  - "packages/agent-plugins/pi"
  - "packages/review/app"
  - "apps/*"

nodeLinker: hoisted
enableGlobalVirtualStore: true
strictPeerDependencies: false
autoInstallPeers: false
verifyDepsBeforeRun: false
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@dev.fast/diffr@0.1.7"

overrides:
  # @dev.fast/review declares a registry range; this override is what makes
  # it resolve to the workspace package. Do not remove it.
  "@dev.fast/local-vcs": "workspace:0.1.0"
  esbuild: "0.28.1"
  hono: "4.13.5"
  postcss: "8.5.23"
  undici: "7.29.0"
  vite: "8.0.16"

allowBuilds:
  esbuild: true
