on:
  push:
    branches: [main]
    paths:
      - "diffr/**"
      - ".github/workflows/diffr-test.yml"
  pull_request:
    paths:
      - "diffr/**"
      - ".github/workflows/diffr-test.yml"
  workflow_dispatch:
    inputs:
      cpu_profile:
        description: Record Linux CPU samples (adds diagnostic overhead)
        type: boolean
        default: false

name: Diffr Test

permissions:
  contents: read

concurrency:
  group: diffr-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        # ARM Linux needs native memfd support. macos-14 is ARM, so Intel uses cross.
        job: >-
          ${{ fromJSON(github.event_name == 'pull_request' &&
          '[{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-22.04"}]' ||
          '[{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-22.04"},
          {"target":"x86_64-pc-windows-msvc","os":"windows-latest"},
          {"target":"aarch64-pc-windows-msvc","os":"windows-11-arm"},
          {"target":"aarch64-unknown-linux-gnu","os":"ubuntu-24.04-arm"},
          {"target":"aarch64-apple-darwin","os":"macos-14"},
          {"target":"x86_64-apple-darwin","os":"macos-14","use-cross":true},
          {"target":"x86_64-unknown-linux-musl","os":"ubuntu-22.04","use-cross":true}]') }}
    defaults:
      run:
        working-directory: diffr
    env:
      BUILD_CMD: cargo
      PROFILE_CPU: ${{ github.event_name == 'workflow_dispatch' && inputs.cpu_profile || false }}

    steps:
    - name: Checkout source code
      # v4.2.2
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.99.0
      with:
        targets: ${{ matrix.job.target }}, wasm32-wasip2

    - name: Restore Rust build cache
      if: matrix.job.target == 'x86_64-unknown-linux-gnu'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: ${{ matrix.job.target }}-${{ matrix.job.os }}
        workspaces: |
          diffr -> target
          diffr/plugins/workspace -> ../../target/wasm-plugins
          diffr/plugins/workspace -> ../../target/concurrent-guest-probe
        cache-workspace-crates: true

    - name: Install cross
      if: matrix.job.use-cross
      uses: taiki-e/install-action@1329c298aa20c3257846c9b2e0e55967df3e3c37 # v2
      with:
        tool: cross@0.2.5

    - name: Overwrite build command env variable
      if: matrix.job.use-cross
      shell: bash
      run: echo "BUILD_CMD=cross" >> $GITHUB_ENV

    - name: Install Linux CPU profiler
      if: matrix.job.target == 'x86_64-unknown-linux-gnu' && github.event_name == 'workflow_dispatch' && inputs.cpu_profile
      shell: bash
      run: |
        echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends linux-tools-generic
        PERF=$(find -L /usr/lib/linux-tools -type f -name perf | sort -V | tail -n 1)
        test -n "$PERF" && test -x "$PERF"
        echo "PERF=$PERF" >> "$GITHUB_ENV"
        # Allow user-space sampling without running Cargo or tests as root.
        sudo sysctl -w kernel.perf_event_paranoid=2
        "$PERF" --version
        "$PERF" record -F 49 -e cpu-clock:u --call-graph dwarf,4096 -o "$RUNNER_TEMP/perf-probe.data" -- sleep 0.1

    - name: Compile tests and record Cargo timings
      if: matrix.job.target != 'x86_64-unknown-linux-gnu'
      shell: bash
      run: $BUILD_CMD test --target ${{ matrix.job.target }} --no-run --timings

    - name: Measure Linux compilation and record Cargo timings
      if: matrix.job.target == 'x86_64-unknown-linux-gnu'
      shell: bash
      env:
        PROFILE_PHASE: build
      run: bash scripts/ci-profile.sh cargo test --target ${{ matrix.job.target }} --no-run --timings

    - name: Measure Linux tests
      if: matrix.job.target == 'x86_64-unknown-linux-gnu'
      shell: bash
      run: bash scripts/ci-profile.sh cargo test --target ${{ matrix.job.target }}

    - name: Run tests
      if: matrix.job.target != 'x86_64-unknown-linux-gnu'
      shell: bash
      run: $BUILD_CMD test --target ${{ matrix.job.target }}

    - name: Upload build timings and test profile
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: diffr-profile-${{ matrix.job.target }}
        path: |
          diffr/target/cargo-timings
          diffr/diagnostics
        if-no-files-found: warn
        retention-days: 7

  crate_packages:
    name: Verify crates.io packages
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: diffr
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      # Build extracted archives together, with their internal dependencies
      # staged locally instead of requiring them to be published already.
      - run: cargo package --locked -p diffr-grammars -p diffr-core -p diffr-cli

  test_wasm_plugins:
    name: Test WASM component plugins
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: diffr
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          # The tests build every bundled plugin as a component.
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            diffr -> target
            diffr/plugins/workspace -> ../../target/wasm-plugins
            diffr/plugins/workspace -> ../../target/concurrent-guest-probe
          cache-workspace-crates: true
      # Rebuild the components and test external loading and async HTTP.
      # The target matrix above exercises the embedded components.
      - run: cargo xtask test-plugins

  test_mime_db:
    name: Test with MIME database
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: diffr
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: diffr -> target
          cache-workspace-crates: true
      # This runs tests that rely on the MIME database being present.
      - run: cargo test -- --ignored

  test_linux_latest_stable:
    name: Test Linux (latest stable Rust)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: diffr
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - run: cargo +stable test

  fmt:
    name: Rustfmt
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: diffr
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path plugins/workspace/Cargo.toml --all -- --check

  actionlint:
    name: Actionlint
    runs-on: ubuntu-22.04
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.0"
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck=

  typo-check:
    name: Typo Check
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: diffr
    timeout-minutes: 10
    env:
      FORCE_COLOR: 1
      TYPOS_VERSION: v1.38.1
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download typos
        run: curl -LsSf https://github.com/crate-ci/typos/releases/download/$TYPOS_VERSION/typos-$TYPOS_VERSION-x86_64-unknown-linux-musl.tar.gz | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
      - name: Check for typos
        run: typos

  test_typescript:
    name: Test @dev.fast/diffr
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: diffr
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: diffr -> target
          cache-workspace-crates: true
      - working-directory: .
        run: pnpm install --frozen-lockfile
      - run: cargo build --locked
      - working-directory: diffr/diffr-ts
        run: |
          pnpm typecheck
          pnpm build
          pnpm test

  typescript_packages:
    name: TypeScript frontends
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile
      - working-directory: diffr/packages/viewer
        run: |
          pnpm typecheck
          pnpm test
      - working-directory: diffr/packages/consumer
        run: |
          pnpm typecheck
          pnpm test
      - working-directory: diffr/packages/claude-code
        run: |
          pnpm build
          git diff --exit-code -- plugin
      - working-directory: diffr/packages/tui
        run: |
          pnpm typecheck
          pnpm test

  whiteboard_integration:
    name: Whiteboard integration with diffr
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dev.fast/whiteboard test:integration:diffr
