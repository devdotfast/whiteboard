name: Whiteboard Preview

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to build"
        required: true
        type: string
        default: main
      dry_run:
        description: "Build and validate only. Do not upload."
        required: false
        type: boolean
        default: false
      platforms:
        description: "Platforms to release; only all creates a promotable preview tag"
        required: true
        type: choice
        options:
          - all
          - macos
          - linux
          - windows
        default: all

permissions:
  contents: read

concurrency:
  group: review-desktop-preview
  cancel-in-progress: false

jobs:
  approve:
    name: Approve release
    environment: review-release-approval
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "Release approved"

  version:
    needs: approve
    name: Compute preview version
    # Approval is handled by approve; this environment supplies credentials.
    environment: review-release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      # Resolve the mutable input only once. Downstream jobs pin this commit so
      # retries cannot silently build a branch that moved after versioning.
      - name: Checkout preview ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Compute preview version
        id: version
        shell: bash
        run: |
          CURRENT=$(node -p "require('./apps/review-desktop/package.json').version")
          if [[ "$CURRENT" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)([-+].*)?$ ]]; then
            PATCH="${BASH_REMATCH[3]}"
            NEXT_PATCH="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((PATCH + 1))"
          else
            echo "::error::Cannot compute next patch from ${CURRENT}"
            exit 1
          fi
          VERSION="${NEXT_PATCH}-preview.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          COMMIT=$(git rev-parse HEAD)

          echo "Building Whiteboard ${VERSION} from ${COMMIT}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      # A re-run reuses GITHUB_RUN_NUMBER, so it recomputes the same version
      # string while re-resolving the mutable ref, which may have moved on. Left
      # to the tag push at the end, that collision would surface only after
      # signing, notarization, and an R2 upload that already overwrote the keys
      # for this version.
      - name: Check the preview tag is free
        shell: bash
        env:
          TAG: v${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          # Prefer the peeled line so an annotated tag resolves to its commit.
          EXISTING=$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" \
            | awk '{ if (index($2, "^{}")) peeled = $1; else plain = $1 }
                   END { print (peeled != "" ? peeled : plain) }')

          if [ -z "$EXISTING" ]; then
            echo "${TAG} is free."
          elif [ "$EXISTING" = "$COMMIT" ]; then
            echo "${TAG} already points at ${COMMIT}; this run republishes it."
          else
            echo "::error::${TAG} already exists on origin at ${EXISTING}, but this run builds ${COMMIT}. Delete the tag, or start a fresh run so a new run number produces a new version."
            exit 1
          fi

  # The remote server package, published at this Desktop version from the
  # same commit before any app is packaged, so a released Desktop can always
  # install its matching `@dev.fast/whiteboard` on a remote machine.
  npm:
    name: Publish npm package
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      whiteboard_remote: ${{ steps.remote.outputs.whiteboard_remote }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Install build dependencies
        run: pnpm install --frozen-lockfile
      # Read-only. A rerun finds this version already published from this
      # commit and skips validation and publishing; from another commit only a
      # dry run may go on, to build and retain the tarball.
      - name: Resolve dist-tag and publication state
        id: npm
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DIST_TAG=$(node scripts/review-cli-release.mjs dist-tag "$VERSION")
          if PUBLISHED=$(node scripts/review-cli-release.mjs published "$VERSION" "$COMMIT"); then
            :
          elif [ "$DRY_RUN" = true ]; then
            echo "::warning::@dev.fast/whiteboard@${VERSION} exists on npm from another commit, or the registry check failed (see above); this dry run skips publish validation."
            PUBLISHED=true
          else
            exit 1
          fi
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
      # The package carries the VS Code server, built from this commit so a
      # Desktop from the same run passes the server's commit check.
      - name: Install Code OSS native build prerequisites
        run: |
          # The hosted runner image lists an HTTP Azure mirror first. That
          # mirror can accept the release file and then hang on package indexes.
          echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbfile-dev libkrb5-dev libsecret-1-dev
      - name: Setup Code OSS Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/review-desktop/code-oss/.nvmrc
          cache: npm
          cache-dependency-path: apps/review-desktop/code-oss/**/package-lock.json
      - name: Compute Code OSS dependency key
        id: code-oss-inputs
        run: |
          DIGEST=$(node apps/review-desktop/scripts/code-oss-bootstrap.mjs digest apps/review-desktop/code-oss)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Restore Code OSS dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/review-desktop/code-oss/node_modules
            apps/review-desktop/code-oss/build/node_modules
            apps/review-desktop/code-oss/extensions/node_modules
            apps/review-desktop/code-oss/extensions/*/node_modules
            apps/review-desktop/code-oss/extensions/*/server/node_modules
            apps/review-desktop/code-oss/.build/distro/npm/node_modules
            apps/review-desktop/code-oss/.build/distro/npm/remote/node_modules
            apps/review-desktop/code-oss/.build/distro/npm/remote/web/node_modules
            ~/.cache/node-gyp
          key: ${{ runner.os }}-code-oss-deps-v3-${{ steps.code-oss-inputs.outputs.digest }}
          restore-keys: |
            ${{ runner.os }}-code-oss-deps-v3-
      - name: Build the VS Code server
        run: |
          source apps/review-desktop/scripts/code-oss-dependencies.sh
          ensure_code_oss_dependencies "$PWD/apps/review-desktop" "$PWD/apps/review-desktop/code-oss"
          BUILD_SOURCEVERSION="$COMMIT" node apps/review-desktop/scripts/build-remote-runtime.mjs
      - name: Build release tarball
        run: |
          jq -n --arg version "$VERSION" --arg commit "$COMMIT" '{$version, $commit}' > release-plan.json
          node scripts/pack-review-cli.mjs release-artifacts
      - name: Test installed tarball without Desktop
        run: node scripts/smoke-review-cli.mjs "release-artifacts/dev.fast-whiteboard-${VERSION}.tgz" "$VERSION"
      # Pins the bytes a Desktop installs on a remote: the package's integrity
      # and Node's checksums, stamped into product.json by the app builds. A
      # version already published from this commit is pinned as the registry
      # serves it, since a rebuilt tarball need not be byte-identical.
      - name: Pin the remote package and Node
        id: remote
        env:
          PUBLISHED: ${{ steps.npm.outputs.published }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          TARBALL="release-artifacts/dev.fast-whiteboard-${VERSION}.tgz"
          if [ "$PUBLISHED" = true ] && [ "$DRY_RUN" != true ]; then
            TARBALL="$RUNNER_TEMP/$(cd "$RUNNER_TEMP" && npm pack "@dev.fast/whiteboard@${VERSION}" --silent)"
          fi
          PIN=$(node apps/review-desktop/scripts/stamp-remote-package.mjs "$TARBALL")
          echo "whiteboard_remote=$PIN" >> "$GITHUB_OUTPUT"
      - name: Validate npm publish command
        if: ${{ steps.npm.outputs.published != 'true' }}
        env:
          DIST_TAG: ${{ steps.npm.outputs.dist_tag }}
        run: npm publish "./release-artifacts/dev.fast-whiteboard-${VERSION}.tgz" --dry-run --registry=https://registry.npmjs.org --access public --tag "$DIST_TAG" --ignore-scripts
      - name: Retain tested package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whiteboard-npm-${{ env.VERSION }}
          path: release-artifacts/*.tgz
          if-no-files-found: error
      - name: Publish tested package
        if: ${{ !inputs.dry_run && steps.npm.outputs.published != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.npm.outputs.dist_tag }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo 'NPM_TOKEN secret is missing.' >&2; exit 1; }
          npm publish "./release-artifacts/dev.fast-whiteboard-${VERSION}.tgz" --registry=https://registry.npmjs.org --access public --tag "$DIST_TAG" --provenance --ignore-scripts

  # Previews publish a signed whiteboard-preview package, so the Linux
  # build signs with the production repository key rather than a CI key.
  linux:
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    needs: [version, npm]
    uses: ./.github/workflows/review-linux-build.yml
    with:
      commit: ${{ needs.version.outputs.commit }}
      version: ${{ needs.version.outputs.version }}
      whiteboard_remote: ${{ needs.npm.outputs.whiteboard_remote }}
      release_signing: ${{ !inputs.dry_run }}
    secrets: inherit

  windows:
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    needs: [version, npm]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/review-windows-build.yml
    with:
      commit: ${{ needs.version.outputs.commit }}
      version: ${{ needs.version.outputs.version }}
      whiteboard_remote: ${{ needs.npm.outputs.whiteboard_remote }}
      sign: true

  macos:
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'macos' }}
    needs: [version, npm]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/review-macos-build.yml
    with:
      commit: ${{ needs.version.outputs.commit }}
      version: ${{ needs.version.outputs.version }}
      whiteboard_remote: ${{ needs.npm.outputs.whiteboard_remote }}
      channel: preview
    secrets: inherit

  validate:
    name: Validate selected platforms
    needs: [version, macos, linux, windows]
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    env:
      PLATFORMS: ${{ inputs.platforms }}
      macos: ${{ needs.macos.result }}
      linux: ${{ needs.linux.result }}
      windows: ${{ needs.windows.result }}
    steps:
      - name: Require every selected build and validation
        run: |
          for platform in macos linux windows; do
            if [ "$PLATFORMS" = all ] || [ "$PLATFORMS" = "$platform" ]; then
              result="${!platform}"
              if [ "$result" != success ]; then
                echo "::error::${platform} build and validation: ${result}"
                exit 1
              fi
            fi
          done

  publish-macos:
    name: Publish macOS preview
    needs: [version, validate]
    if: ${{ !cancelled() && needs.validate.result == 'success' && !inputs.dry_run && (inputs.platforms == 'all' || inputs.platforms == 'macos') }}
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: warn
          pattern: macos-*
          path: dist

      # Payloads first, manifests last: a client must never see a latest.json
      # whose zip is not yet downloadable, on either arch.
      - name: Upload preview to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          AWS_REGION: auto
          R2_BUCKET: ${{ vars.R2_RELEASE_BUCKET }}
        run: |
          for dir in dist/macos-*; do
            target="${dir#dist/macos-}"
            DMG_DISPOSITION="attachment; filename=\"df-whiteboard-preview-${RELEASE_VERSION}-${target#darwin-}.dmg\""
            RELEASE_PREFIX="s3://${R2_BUCKET}/releases/${RELEASE_VERSION}/${target}"
            for zip in "$dir"/*-"${target}"-"${RELEASE_VERSION}".zip; do
              aws s3 cp "$zip" "${RELEASE_PREFIX}/$(basename "$zip")" \
                --content-type application/zip
            done
            aws s3 cp "$dir/Whiteboard-${target}-${RELEASE_VERSION}.dmg" \
              "${RELEASE_PREFIX}/Whiteboard-${target}-${RELEASE_VERSION}.dmg" \
              --content-type application/x-apple-diskimage \
              --content-disposition "$DMG_DISPOSITION"
            aws s3 cp "$dir/Whiteboard-${target}-${RELEASE_VERSION}.dmg" \
              "s3://${R2_BUCKET}/releases/preview-latest/${target}/Whiteboard.dmg" \
              --content-type application/x-apple-diskimage \
              --content-disposition "$DMG_DISPOSITION"
          done

          for dir in dist/macos-*; do
            target="${dir#dist/macos-}"
            aws s3 cp "$dir/latest.json" \
              "s3://${R2_BUCKET}/update/preview/${target}/latest.json" \
              --content-type application/json
          done

      - name: Verify preview update feed
        run: |
          echo "Feed for an outdated preview client (expect 200 with ${RELEASE_VERSION}):"
          RESPONSE=$(curl -sf "https://update.dev.fast/api/update/darwin-arm64/preview/0000000000000000000000000000000000000000")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -F "\"productVersion\":\"${RELEASE_VERSION}\""
          echo "$RESPONSE" | grep -F "\"version\":\"${RELEASE_COMMIT}\""
          echo "$RESPONSE" | grep -F "/Review-darwin-arm64-${RELEASE_VERSION}.zip"

          echo "Feed for a Whiteboard Preview.app install (expect the Whiteboard zip):"
          curl -sf "https://update.dev.fast/api/update/darwin-arm64/preview/0000000000000000000000000000000000000000?bundle=Whiteboard%20Preview" \
            | grep -F "/Whiteboard-darwin-arm64-${RELEASE_VERSION}.zip"

          echo "Feed for the just-released commit (expect 204):"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://update.dev.fast/api/update/darwin-arm64/preview/${RELEASE_COMMIT}")
          echo "$STATUS"
          test "$STATUS" = "204"

          echo "Intel preview feed (clients send plain darwin):"
          curl -sf "https://update.dev.fast/api/update/darwin/preview/0000000000000000000000000000000000000000?bundle=Whiteboard%20Preview" \
            | grep -F "/Whiteboard-darwin-x64-${RELEASE_VERSION}.zip"
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://update.dev.fast/api/update/darwin/preview/${RELEASE_COMMIT}")" = 204

      - name: Verify preview install landing
        run: |
          echo "install.dev.fast/preview (expect 302 to the preview disk image):"
          LOCATION=$(curl -s -o /dev/null -w "%{redirect_url}" https://install.dev.fast/preview)
          echo "$LOCATION"
          test "$LOCATION" = "https://install.dev.fast/releases/preview-latest/darwin-arm64/Whiteboard.dmg"

          echo "Following it (expect 200 and a disk image):"
          curl -sfL -o /dev/null -w "%{http_code} %{content_type}\n" https://install.dev.fast/preview \
            | grep -F "200 application/x-apple-diskimage"

          echo "Intel preview disk image (expect a disk image):"
          curl -sfI https://install.dev.fast/releases/preview-latest/darwin-x64/Whiteboard.dmg | grep -i "content-type: application/x-apple-diskimage"

  publish-linux:
    name: Publish Linux preview repository
    permissions:
      contents: write
    needs: [version, validate]
    if: ${{ !cancelled() && needs.validate.result == 'success' && !inputs.dry_run && (inputs.platforms == 'all' || inputs.platforms == 'linux') }}
    uses: ./.github/workflows/review-linux-publish.yml
    with:
      channel: preview
    secrets: inherit

  publish-windows:
    name: Publish Windows preview installers
    environment: review-release
    needs: [version, validate]
    if: ${{ !cancelled() && needs.validate.result == 'success' && !inputs.dry_run && (inputs.platforms == 'all' || inputs.platforms == 'windows') }}
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: warn
          name: windows-packages
          path: windows-packages
      # Versioned payloads first, then the alias install.dev.fast/windows/preview serves.
      - name: Upload preview to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          AWS_REGION: auto
          R2_BUCKET: ${{ vars.R2_RELEASE_BUCKET }}
        run: |
          RELEASE_PREFIX="s3://${R2_BUCKET}/releases/${RELEASE_VERSION}/win32-x64"
          SETUP="Whiteboard-Preview-${RELEASE_VERSION}-Setup.exe"
          aws s3 cp windows-packages/Whiteboard-win32-x64-user.exe "${RELEASE_PREFIX}/${SETUP}" \
            --content-type application/vnd.microsoft.portable-executable \
            --content-disposition "attachment; filename=\"${SETUP}\""
          aws s3 cp windows-packages/Whiteboard-win32-x64-system.exe "${RELEASE_PREFIX}/Whiteboard-Preview-${RELEASE_VERSION}-System-Setup.exe" \
            --content-type application/vnd.microsoft.portable-executable \
            --content-disposition "attachment; filename=\"Whiteboard-Preview-${RELEASE_VERSION}-System-Setup.exe\""
          aws s3 cp windows-packages/Whiteboard-win32-x64.zip "${RELEASE_PREFIX}/Whiteboard-Preview-win32-x64-${RELEASE_VERSION}.zip" \
            --content-type application/zip
          aws s3 cp windows-packages/Whiteboard-win32-x64-user.exe \
            "s3://${R2_BUCKET}/releases/preview-latest/win32-x64/Whiteboard-Setup.exe" \
            --content-type application/vnd.microsoft.portable-executable \
            --content-disposition "attachment; filename=\"${SETUP}\""
      - name: Verify preview install landing
        run: |
          echo "install.dev.fast/windows/preview (expect 302 to the preview installer):"
          LOCATION=$(curl -s -o /dev/null -w "%{redirect_url}" https://install.dev.fast/windows/preview)
          echo "$LOCATION"
          test "$LOCATION" = "https://install.dev.fast/releases/preview-latest/win32-x64/Whiteboard-Setup.exe"

          echo "Following it (expect 200 and a Windows executable):"
          curl -sfL -o /dev/null -w "%{http_code} %{content_type}\n" https://install.dev.fast/windows/preview \
            | grep -F "200 application/vnd.microsoft.portable-executable"

  # This tagging job holds no signing or R2 credentials.
  # `needs: version` carries the initial approval
  # gate transitively, and `needs: publish-macos`, `needs: publish-linux` and
  # `needs: publish-windows` mean a tag only ever names a preview that published
  # on every platform, answered its update feeds, and served its installers.
  tag-preview:
    name: Tag published preview
    needs: [version, publish-macos, publish-linux, publish-windows]
    if: ${{ !inputs.dry_run && inputs.platforms == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A promotion handle: review-desktop-release.yml resolves this tag back to
      # the commit the preview was built from.
      - name: Push the preview tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          COMMIT: ${{ needs.version.outputs.commit }}
        run: |
          # Tag previews on main's history, including older commits that can
          # still be promoted after main advances.
          STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${COMMIT}" --jq .status)
          case "$STATUS" in
            identical | behind) ;;
            *)
              echo "${COMMIT} is not on main (${STATUS}); a preview off main is not promotable, so it stays untagged."
              exit 0
              ;;
          esac

          SHA=""
          TYPE=""
          if RESPONSE=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>/dev/null); then
            SHA=$(printf '%s' "$RESPONSE" | jq -r .object.sha)
            TYPE=$(printf '%s' "$RESPONSE" | jq -r .object.type)
          fi

          if [ -z "$SHA" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${TAG}" -f "sha=${COMMIT}" >/dev/null
            echo "Tagged ${COMMIT} as ${TAG}."
          elif [ "$TYPE" = "commit" ] && [ "$SHA" = "$COMMIT" ]; then
            echo "${TAG} already points at ${COMMIT}; nothing to do."
          else
            echo "::error::${TAG} exists on origin as ${TYPE} ${SHA}, but this run built ${COMMIT}. Delete the tag before re-running, or start a fresh run so a new run number produces a new version."
            exit 1
          fi
