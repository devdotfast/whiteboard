name: Whiteboard CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      nixos_artifact_runs:
        description: "JSON array of existing Linux build run IDs (stable, preview) to validate on NixOS"
        type: string
        default: "[]"
      nixos_app_artifact:
        description: "Compiled Linux app artifact to repackage for NixOS validation"
        type: string
        default: linux-packages-app
      nixos_coexistence_run:
        description: "Existing full Linux CI run whose stable and preview packages should be checked together"
        type: string
        default: ""
      linux_packages:
        description: "Build and validate stable and preview Linux packages with disposable CI signing keys"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: review-desktop-ci-${{ github.event.pull_request.number || github.ref }}${{ inputs.linux_packages && '-linux' || '' }}
  cancel-in-progress: true

jobs:
  linux-versions:
    if: github.event_name == 'workflow_dispatch' && inputs.linux_packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: versions
        run: |
          node - <<'JS' >> "$GITHUB_OUTPUT"
          const current = require('./apps/review-desktop/package.json').version.split('.');
          const stable = `${current[0]}.${current[1]}.${Number(current[2]) + 1}`;
          const preview = `${stable}-preview.${new Date().toISOString().slice(0,10).replaceAll('-','')}.${process.env.GITHUB_RUN_NUMBER}`;
          console.log(`matrix=${JSON.stringify({include: [{channel: 'stable', version: stable}, {channel: 'preview', version: preview}]})}`);
          JS

  linux-packages:
    name: Linux CI (${{ matrix.channel }})
    needs: linux-versions
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.linux-versions.outputs.matrix) }}
    uses: ./.github/workflows/review-linux-build.yml
    with:
      commit: ${{ github.sha }}
      version: ${{ matrix.version }}
      artifact_name: linux-ci-${{ matrix.channel }}
      runner: ubuntu-latest
      release_signing: false
    secrets: inherit

  nixos-coexistence:
    name: NixOS channel coexistence
    permissions:
      contents: read
      actions: read
    needs: [nixos, linux-packages]
    if: ${{ !cancelled() && (inputs.nixos_coexistence_run != '' || needs.linux-packages.result == 'success' || (needs.nixos.result == 'success' && fromJSON(inputs.nixos_artifact_runs)[1] != null)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ (inputs.linux_packages || inputs.nixos_coexistence_run != '') && 'linux-ci-stable' || format('nixos-validation-{0}', fromJSON(inputs.nixos_artifact_runs)[0]) }}
          path: stable
          run-id: ${{ inputs.nixos_coexistence_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ (inputs.linux_packages || inputs.nixos_coexistence_run != '') && 'linux-ci-preview' || format('nixos-validation-{0}', fromJSON(inputs.nixos_artifact_runs)[1]) }}
          path: preview
          run-id: ${{ inputs.nixos_coexistence_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Check CLI launches and stable/preview coexistence
        run: |
          STABLE=$(find "$PWD/stable" -name 'whiteboard-[0-9]*.nix.tar.gz')
          PREVIEW=$(find "$PWD/preview" -name 'whiteboard-preview-*.nix.tar.gz')
          test -n "$STABLE" && test -n "$PREVIEW"
          nix build -L --impure --file apps/review-desktop/scripts/linux/nixos/coexistence-test.nix \
            --argstr stableArchive "$STABLE" --argstr previewArchive "$PREVIEW" \
            --out-link nixos-coexistence
      - name: Upload coexistence evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nixos-coexistence
          path: nixos-coexistence/
          if-no-files-found: ignore
          retention-days: 7

  nixos:
    name: NixOS (${{ matrix.run }})
    if: github.event_name == 'workflow_dispatch' && inputs.nixos_artifact_runs != '[]' && inputs.nixos_artifact_runs != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(inputs.nixos_artifact_runs) }}
    env:
      GNUPGHOME: ${{ github.workspace }}/.nixos-signing
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/review-desktop/code-oss/.nvmrc
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.nixos_app_artifact }}
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/linux-app
      - name: Repackage the compiled Linux release
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd gnupg
          tar --zstd -xf "$RUNNER_TEMP/linux-app/linux-app.tar.zst"
          bash apps/review-desktop/scripts/package-linux-distributions.sh nixos
      - name: Sign a disposable NixOS publication
        run: |
          install -d -m 0700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-generate-key 'Whiteboard NixOS CI <ci@dev.fast>' rsa3072 sign 1d
          FINGERPRINT=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')
          python3 - "$FINGERPRINT" <<'PY'
          import importlib.util, json, subprocess, sys
          from pathlib import Path
          scripts = Path("apps/review-desktop/scripts")
          spec = importlib.util.spec_from_file_location("builder", scripts / "build-linux-repository.py")
          builder = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)
          release = json.loads(Path("apps/review-desktop/code-oss/.build/linux/nixos/x86_64/package/release.json").read_text())
          version = release["version"].replace("-preview.", "~preview.")
          prefix = "repos/preview" if "-preview." in release["version"] else "repos"
          generation = f"{version}-{release['revision']}-{release['commit']}"
          repos = Path("linux-repository") / prefix
          builder.build_nixos(Path("apps/review-desktop/dist/linux"), repos / "snapshots" / generation,
                              release["packageName"], version, release["revision"], release["commit"], sys.argv[1])
          keys = Path("linux-repository/repos/keys")
          keys.mkdir(parents=True, exist_ok=True)
          (keys / f"{sys.argv[1]}.asc").write_bytes(subprocess.check_output(["gpg", "--batch", "--armor", "--export", sys.argv[1]]))
          (repos / "current.json").write_text(json.dumps(dict(schemaVersion=1, format="rpm", nixos=True,
              packageName=release["packageName"], version=version, generation=generation, commit=release["commit"], keyFingerprint=sys.argv[1])))
          PY
      - name: Verify package and run NixOS VM
        run: bash apps/review-desktop/scripts/linux/verify-nixos.sh linux-repository
      - name: Upload NixOS evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nixos-validation-${{ matrix.run }}
          path: |
            nixos-validation
            apps/review-desktop/dist/linux/*.nix.tar.gz
            apps/review-desktop/dist/linux/*.nix.tar.gz.asc
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove disposable signing credentials
        if: always()
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"

  review-desktop:
    name: Review Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Fetch legacy Review fixture commits
        shell: bash
        run: |
          mapfile -t fixture_commits < <(
            jq -r '
              select(.sourceRepository == "devdotfast/review") |
              .baseCommit, .sourceCommit
            ' packages/review/src/fixtures/legacy-reviews/*.json |
              sort -u
          )
          test "${#fixture_commits[@]}" -gt 0
          git fetch --no-tags origin "${fixture_commits[@]}"
          for commit in "${fixture_commits[@]}"; do
            git cat-file -e "${commit}^{commit}"
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup monorepo Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright Chromium
        id: playwright-chromium
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-chromium.outputs.cache-hit != 'true'
        run: pnpm --filter @dev.fast/review-canvas exec playwright install chromium --only-shell

      - name: Save Playwright Chromium
        if: steps.playwright-chromium.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      # Headers for the Code OSS native modules npm ci builds from source:
      # native-keymap needs x11/xkbfile, kerberos needs krb5, and the secret
      # storage bindings need libsecret.
      - name: Install Code OSS native build prerequisites
        run: |
          # The hosted runner image lists an HTTP Azure mirror first. That
          # mirror can accept the release file and then hang on package indexes.
          echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbfile-dev libkrb5-dev libsecret-1-dev python3

      - name: Install Playwright Chromium system dependencies
        run: pnpm --filter @dev.fast/review-canvas exec playwright install-deps chromium

      - name: Setup Code OSS Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/review-desktop/code-oss/.nvmrc
          cache: npm
          cache-dependency-path: apps/review-desktop/code-oss/**/package-lock.json

      - name: Compute Code OSS dependency digest
        id: code-oss-dependency-digest
        run: echo "digest=$(node apps/review-desktop/scripts/code-oss-bootstrap.mjs digest apps/review-desktop/code-oss)" >> "$GITHUB_OUTPUT"

      # out/ is deliberately not cached: the build rebuilds it from scratch, so
      # caching it only adds download/upload time. The nested extension and
      # build-tool node_modules are cached so postinstall's per-directory npm
      # installs become no-ops on a warm cache. Restore and save are split so
      # the save lands right after a validated build — a failure later in the
      # job (e.g. a flaky integration test) cannot prevent the cache from
      # persisting. restore-keys lets a lockfile bump start from the previous
      # tree and install only the delta.
      - name: Restore Code OSS dependencies
        id: code-oss-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/review-desktop/code-oss/node_modules
            apps/review-desktop/code-oss/build/node_modules
            apps/review-desktop/code-oss/extensions/node_modules
            apps/review-desktop/code-oss/extensions/*/node_modules
            apps/review-desktop/code-oss/extensions/*/server/node_modules
            apps/review-desktop/code-oss/.build/distro/npm/node_modules
            apps/review-desktop/code-oss/.build/distro/npm/remote/node_modules
            apps/review-desktop/code-oss/.build/distro/npm/remote/web/node_modules
            apps/review-desktop/code-oss/.build/electron
            ~/.cache/node-gyp
          key: ${{ runner.os }}-${{ runner.arch }}-code-oss-deps-v3-${{ steps.code-oss-dependency-digest.outputs.digest }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-code-oss-deps-v3-

      - name: Build Whiteboard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_DESKTOP_CI_FAST: "1"
        run: pnpm --filter @dev.fast/review-desktop app:build

      - name: Validate Whiteboard build
        run: |
          test -d apps/review-desktop/code-oss/node_modules
          test -f apps/review-desktop/code-oss/out/main.js

      - name: Save Code OSS dependencies
        if: steps.code-oss-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/review-desktop/code-oss/node_modules
            apps/review-desktop/code-oss/build/node_modules
            apps/review-desktop/code-oss/extensions/node_modules
            apps/review-desktop/code-oss/extensions/*/node_modules
            apps/review-desktop/code-oss/extensions/*/server/node_modules
            apps/review-desktop/code-oss/.build/distro/npm/node_modules
            apps/review-desktop/code-oss/.build/distro/npm/remote/node_modules
            apps/review-desktop/code-oss/.build/distro/npm/remote/web/node_modules
            apps/review-desktop/code-oss/.build/electron
            ~/.cache/node-gyp
          key: ${{ runner.os }}-${{ runner.arch }}-code-oss-deps-v3-${{ steps.code-oss-dependency-digest.outputs.digest }}

      - name: Check the tutorial assets
        run: pnpm --filter @dev.fast/review check:tutorial

      # The build already built workspace dependencies and typechecked Code OSS.
      - name: Typecheck
        run: |
          pnpm -r --filter '!@dev.fast/review-desktop' --workspace-concurrency=1 --if-present typecheck

      # Typecheck prepared the shared tutorial assets before concurrent pretests.
      - name: Test
        run: |
          node --test "scripts/**/*.test.mjs"
          pnpm -r --no-sort --workspace-concurrency=3 --if-present test

      - name: Bundled diffr integration
        run: |
          pnpm --filter @dev.fast/review ensure:diffr --required
          pnpm --filter @dev.fast/review exec vitest run --config vitest.integration.config.ts

      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-browser-diagnostics
          path: |
            packages/review/app/.vitest-attachments
            packages/review/**/__screenshots__
            packages/review/**/__traces__
          if-no-files-found: ignore
