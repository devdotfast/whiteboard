name: Whiteboard Linux packages

on:
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
      version:
        type: string
        default: ""
      whiteboard_remote:
        description: The npm job's remote pin (stamp-remote-package.mjs); required with a version.
        type: string
        default: ""
      package_revision:
        type: string
        default: "1"
      runner:
        type: string
        default: review_big_boy
      artifact_name:
        type: string
        default: linux-packages
      release_signing:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    name: Build shared Linux app
    outputs:
      version: ${{ steps.archive.outputs.version }}
    environment: ${{ inputs.release_signing && 'review-release' || 'review-linux-ci' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      BUILD_SOURCEVERSION: ${{ inputs.commit }}
      REVIEW_LINUX_PACKAGE_REVISION: ${{ inputs.package_revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
      - name: Stamp release identity
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          QUALITY=stable
          if [[ "$VERSION" == *-preview.* ]]; then QUALITY=preview; fi
          node apps/review-desktop/scripts/stamp-release-channel.mjs --version "$VERSION" --quality "$QUALITY"
      - name: Pin the remote package and Node
        if: inputs.version != ''
        env:
          WHITEBOARD_REMOTE: ${{ inputs.whiteboard_remote }}
        run: node apps/review-desktop/scripts/stamp-remote-package.mjs --pinned "$WHITEBOARD_REMOTE"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/review-desktop/code-oss/.nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test publication failure boundaries
        run: python3 apps/review-desktop/scripts/linux/test-publication.py
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbfile-dev libkrb5-dev libsecret-1-dev \
            libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libnotify4 \
            zstd xvfb dbus-x11 unzip
      - name: Build and assemble Linux app
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_DESKTOP_CI_FAST: "1"
          # Only stamped releases ship the telemetry key.
          REVIEW_POSTHOG_KEY: ${{ inputs.version != '' && vars.REVIEW_POSTHOG_KEY || '' }}
        run: |
          pnpm desktop:build
          pnpm desktop:package:linux
      - name: Configure packaged Electron sandbox
        run: |
          sudo chown root:root apps/review-desktop/VSCode-linux-x64/chrome-sandbox
          sudo chmod 4755 apps/review-desktop/VSCode-linux-x64/chrome-sandbox
      - name: Smoke test the packaged app
        run: xvfb-run -a node apps/review-desktop/scripts/smoke-launch-packaged.mjs --app apps/review-desktop/VSCode-linux-x64
      - name: Archive shared Linux app
        id: archive
        run: |
          echo "version=$(node -p "require('./apps/review-desktop/package.json').version")" >> "$GITHUB_OUTPUT"
          tar --zstd -cf "$RUNNER_TEMP/linux-app.tar.zst" \
            apps/review-desktop/VSCode-linux-x64 apps/review-desktop/package.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-app
          path: ${{ runner.temp }}/linux-app.tar.zst
          retention-days: 3
          compression-level: 0

  # Package the pinned app with the helpers from this workflow revision.
  package:
    name: Package Linux (${{ matrix.format }})
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        format: [rpm, deb, arch, nixos]
    env:
      REVIEW_LINUX_PACKAGE_REVISION: ${{ inputs.package_revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/review-desktop/code-oss/.nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}-app
          path: ${{ runner.temp }}/linux-app
      - name: Extract shared Linux app
        run: tar --zstd -xf "$RUNNER_TEMP/linux-app/linux-app.tar.zst"
      - name: Install package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rpm zstd dpkg-dev libgtk-3-0t64 libnss3 libasound2t64 libgbm1 \
            libnotify4 libsecret-1-0 libkrb5-3 libxkbfile1
      - name: Build package
        env:
          FORMAT: ${{ matrix.format }}
        run: bash apps/review-desktop/scripts/package-linux-distributions.sh "$FORMAT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-unsigned-${{ matrix.format }}
          path: apps/review-desktop/dist/linux/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  repository:
    name: Sign Linux repositories
    needs: [linux, package]
    environment: ${{ inputs.release_signing && 'review-release' || 'review-linux-ci' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_SOURCEVERSION: ${{ inputs.commit }}
      REVIEW_LINUX_PACKAGE_REVISION: ${{ inputs.package_revision }}
      GNUPGHOME: ${{ github.workspace }}/.linux-signing
      REVIEW_SIGNING_PASSPHRASE_FILE: ${{ github.workspace }}/.linux-signing/passphrase
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
      - name: Stamp release identity
        env:
          VERSION: ${{ needs.linux.outputs.version }}
        run: |
          QUALITY=stable
          if [[ "$VERSION" == *-preview.* ]]; then QUALITY=preview; fi
          node apps/review-desktop/scripts/stamp-release-channel.mjs --version "$VERSION" --quality "$QUALITY"
      - name: Install signing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm createrepo-c zstd gnupg apt-utils
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifact_name }}-unsigned-*
          merge-multiple: true
          path: apps/review-desktop/dist/linux
      - name: Prepare repository signing key
        id: signing
        env:
          RELEASE_SIGNING: ${{ inputs.release_signing }}
          SIGNING_KEY: ${{ secrets.LINUX_REPOSITORY_SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.LINUX_REPOSITORY_SIGNING_PASSPHRASE }}
          SIGNING_FINGERPRINT: ${{ vars.LINUX_REPOSITORY_SIGNING_FINGERPRINT }}
        run: |
          install -d -m 0700 "$GNUPGHOME"
          umask 077
          printf '%s' "$SIGNING_PASSPHRASE" > "$REVIEW_SIGNING_PASSPHRASE_FILE"
          if [ "$RELEASE_SIGNING" = true ]; then
            test -n "$SIGNING_KEY"
            [[ "$SIGNING_FINGERPRINT" =~ ^[A-F0-9]{40}$ ]]
            printf '%s' "$SIGNING_KEY" | base64 --decode | gpg --batch --import
          else
            gpg --batch --pinentry-mode loopback --passphrase '' --quick-generate-key 'Whiteboard package CI <ci@dev.fast>' rsa3072 sign 1d
            SIGNING_FINGERPRINT=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')
          fi
          echo "fingerprint=$SIGNING_FINGERPRINT" >> "$GITHUB_OUTPUT"
      - name: Build signed repository snapshot
        env:
          FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
          CHANNEL: ${{ contains(needs.linux.outputs.version, '-preview.') && 'preview' || 'stable' }}
        run: |
          # The RPM version is the tilde form of a preview version.
          VERSION=$(node -p "require('./apps/review-desktop/package.json').version.replace('-preview.', '~preview.')")
          python3 apps/review-desktop/scripts/build-linux-repository.py \
            --packages apps/review-desktop/dist/linux \
            --output apps/review-desktop/dist/linux-repository \
            --version "$VERSION" --revision "$REVIEW_LINUX_PACKAGE_REVISION" \
            --commit "$BUILD_SOURCEVERSION" --fingerprint "$FINGERPRINT" --channel "$CHANNEL"
          find apps/review-desktop/dist/linux-repository -name '*.rpm' -exec cp {} apps/review-desktop/dist/linux/ \;
          find apps/review-desktop/dist/linux-repository -path '*/repos*/arch/x86_64/*.pkg.tar.zst.sig' -exec cp {} apps/review-desktop/dist/linux/ \;
          tar --zstd -cf apps/review-desktop/dist/linux/linux-publication.tar.zst -C apps/review-desktop/dist/linux-repository .
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            apps/review-desktop/dist/linux/*.rpm
            apps/review-desktop/dist/linux/*.deb
            apps/review-desktop/dist/linux/*.tar.zst
            apps/review-desktop/dist/linux/*.sig
            apps/review-desktop/dist/linux/*.nix.tar.gz
            apps/review-desktop/dist/linux/*.nix.tar.gz.asc
          retention-days: 7
          compression-level: 0
      - name: Remove signing credentials
        if: always()
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"

  validate:
    name: Validate Linux (${{ matrix.target }})
    needs: repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: ["43", "44", ubuntu, arch]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: linux-packages
      - name: Validate clean installs and rejected signatures
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir linux-repository
          tar --zstd -xf linux-packages/linux-publication.tar.zst -C linux-repository
          bash apps/review-desktop/scripts/linux/verify-repository.sh linux-repository "$TARGET"

  validate-nixos:
    name: Validate Linux (NixOS)
    needs: repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: linux-packages
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Verify signed package and run NixOS VM
        env:
          NIX_CONFIG: |
            experimental-features = nix-command flakes
            accept-flake-config = false
            system-features = nixos-test benchmark big-parallel kvm
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd gnupg
          mkdir linux-repository
          tar --zstd -xf linux-packages/linux-publication.tar.zst -C linux-repository
          bash apps/review-desktop/scripts/linux/verify-nixos.sh linux-repository
      - name: Upload NixOS VM evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-nixos-validation
          path: nixos-validation
          if-no-files-found: ignore
          retention-days: 7
