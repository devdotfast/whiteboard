name: Whiteboard Release

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to release"
        required: true
        type: choice
        options:
          - all
          - macos
          - linux
          - windows
        default: all
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      release_source:
        description: "Release main's tip, or promote a published preview tag."
        required: true
        type: choice
        options:
          - main
          - preview
        default: main
      preview_tag:
        description: "Preview tag to promote, e.g. v0.0.32-preview.20260907.7. Required when release_source is preview."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Build and validate only. Do not tag, upload, or publish."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: review-desktop-release
  cancel-in-progress: false

jobs:
  approve:
    name: Approve release
    environment: review-release-approval
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "Release approved"

  version:
    needs: approve
    name: Tag release
    # Approval is handled by approve; this environment supplies credentials.
    environment: review-release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version || steps.dryrun.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      commit: ${{ steps.bump.outputs.commit || steps.dryrun.outputs.commit }}
    steps:
      # The `main` ruleset requires a pull request and the "Review Desktop"
      # check, and lists DeployKey as its only non-admin bypass actor. Checking
      # out over SSH with the release deploy key is therefore the one way this
      # job can land the version bump on main directly.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Verify Linux release prerequisites
        if: ${{ !inputs.dry_run && (inputs.platforms == 'all' || inputs.platforms == 'linux') }}
        env:
          SIGNING_KEY: ${{ secrets.LINUX_REPOSITORY_SIGNING_KEY }}
          SIGNING_FINGERPRINT: ${{ vars.LINUX_REPOSITORY_SIGNING_FINGERPRINT }}
          R2_BUCKET: ${{ vars.R2_RELEASE_BUCKET }}
        run: |
          test -n "$SIGNING_KEY"
          test -n "$R2_BUCKET"
          [[ "$SIGNING_FINGERPRINT" =~ ^[A-F0-9]{40}$ ]]
          curl -fsS https://install.dev.fast/repos/health | python3 -c 'import json,sys; assert json.load(sys.stdin) == {"schemaVersion": 1, "format": "rpm"}'
          curl -fsS https://install.dev.fast/repos/apt/health | python3 -c 'import json,sys; assert json.load(sys.stdin) == {"schemaVersion": 1, "format": "deb"}'
          curl -fsS https://install.dev.fast/repos/arch/health | python3 -c 'import json,sys; assert json.load(sys.stdin) == {"schemaVersion": 1, "format": "pacman"}'

      # Every read-only gate lives here so a dry run rehearses the same checks a
      # real run must pass, and so the write step below re-derives nothing.
      - name: Resolve release version
        id: resolve
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          RELEASE_SOURCE: ${{ inputs.release_source }}
          PREVIEW_TAG_INPUT: ${{ inputs.preview_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A dispatch form field left with stale text arrives as a non-empty
          # string, so trim before testing for emptiness.
          PREVIEW_TAG="$(printf '%s' "$PREVIEW_TAG_INPUT" | tr -d '[:space:]')"

          if [ "$RELEASE_SOURCE" != "preview" ] && [ -n "$PREVIEW_TAG" ]; then
            echo "::error::preview_tag only applies when release_source is 'preview'. Clear the field, or set release_source to 'preview'."
            exit 1
          fi

          CURRENT=$(node -p "require('./apps/review-desktop/package.json').version")
          # The pattern must stay an unquoted variable: bash matches a quoted
          # right-hand side as a literal string, not as a regex.
          version_re='^([0-9]+)\.([0-9]+)\.([0-9]+)$'
          if [[ ! $CURRENT =~ $version_re ]]; then
            echo "::error::apps/review-desktop/package.json is at '${CURRENT}', which is not X.Y.Z. ${GITHUB_REF_NAME} must never carry a prerelease version."
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "::error::unknown bump type '${BUMP}'"; exit 1 ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}"

          if [ "$RELEASE_SOURCE" = "preview" ]; then
            if [ -z "$PREVIEW_TAG" ]; then
              echo "::error::release_source 'preview' requires preview_tag, e.g. v${VERSION}-preview.$(date -u +%Y%m%d).1 — take it from the preview run that published the build you are promoting."
              exit 1
            fi
            if [ "$BUMP" != "patch" ]; then
              echo "::error::a preview always targets the next patch, so promoting one requires bump 'patch' (got '${BUMP}'). Release from ${GITHUB_REF_NAME} for a minor or major."
              exit 1
            fi

            preview_re='^v([0-9]+\.[0-9]+\.[0-9]+)-preview\.[0-9]{8}\.[0-9]+$'
            if [[ ! $PREVIEW_TAG =~ $preview_re ]]; then
              echo "::error::preview_tag '${PREVIEW_TAG}' is not a preview tag. Expected vX.Y.Z-preview.YYYYMMDD.N, as pushed by review-desktop-preview.yml."
              exit 1
            fi
            PREVIEW_VERSION="${BASH_REMATCH[1]}"

            if ! git ls-remote --exit-code --tags origin "refs/tags/${PREVIEW_TAG}" >/dev/null 2>&1; then
              echo "::error::${PREVIEW_TAG} does not exist on origin. Only a preview that finished publishing from ${GITHUB_REF_NAME} is tagged."
              exit 1
            fi
            # `+` so a tag already in this checkout cannot block the fetch, and
            # `^{commit}` peels a lightweight and an annotated tag alike.
            git fetch --no-tags origin "+refs/tags/${PREVIEW_TAG}:refs/tags/${PREVIEW_TAG}"
            PREVIEW_COMMIT=$(git rev-parse "refs/tags/${PREVIEW_TAG}^{commit}")

            # Whatever merged since the preview published stays out of this
            # release: promotion ships the commit that was actually tested. It
            # must still be on ${GITHUB_REF_NAME}, so a branch that never landed
            # cannot be released. Asked over the API because this checkout is
            # shallow and has no history to walk.
            STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...${PREVIEW_COMMIT}" --jq .status)
            case "$STATUS" in
              identical | behind) ;;
              *)
                echo "::error::${PREVIEW_TAG} was built from ${PREVIEW_COMMIT}, which is not on ${GITHUB_REF_NAME} (${STATUS}). Only a preview built from a commit that landed can be promoted."
                exit 1
                ;;
            esac
            # Load-bearing: a preview computes its version from the package.json
            # it was built against, so this is what catches a preview that
            # straddled another release and now targets a version already cut.
            if [ "$PREVIEW_VERSION" != "$VERSION" ]; then
              echo "::error::${PREVIEW_TAG} targets ${PREVIEW_VERSION}, but the next patch from ${CURRENT} is ${VERSION}. That preview predates a release; publish a new one."
              exit 1
            fi

            echo "Promoting ${PREVIEW_TAG} (${PREVIEW_COMMIT}) to Whiteboard ${TAG}."
          else
            echo "Releasing Whiteboard ${TAG} from ${GITHUB_REF_NAME}."
          fi

          # Remote write-state, checked only where a push actually follows. Both
          # run before anything is written, so a doomed run stops without
          # leaving a tag or a commit behind.
          if [ "$DRY_RUN" != "true" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::error::${TAG} already exists on origin. Delete it before re-running."
              exit 1
            fi

            git fetch origin "${GITHUB_REF_NAME}"
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
              echo "::error::${GITHUB_REF_NAME} moved since this run started. Re-run the workflow."
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "preview_commit=$PREVIEW_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Bump version and create tag
        if: ${{ !inputs.dry_run }}
        id: bump
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          TAG: ${{ steps.resolve.outputs.tag }}
          PREVIEW_COMMIT: ${{ steps.resolve.outputs.preview_commit }}
        run: |
          # product.json carries the same number to the running app, which shows
          # it in the About panel, alongside the stable channel identity.
          # `scripts/product-hardening.test.mjs` fails if these drift apart.
          node apps/review-desktop/scripts/stamp-release-channel.mjs \
            --version "$VERSION" \
            --quality stable

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/review-desktop/package.json apps/review-desktop/code-oss/product.json packages/review/package.json
          git commit -m "chore(review-desktop): bump version to ${VERSION} [skip ci]"

          # The tag marks what shipped, which for a promotion is the commit the
          # preview was built from rather than this bump. The build jobs stamp
          # the version onto that tree, the way the preview run stamped its own.
          # The bump still lands on ${GITHUB_REF_NAME} because the next release
          # derives its version from there.
          TARGET="${PREVIEW_COMMIT:-$(git rev-parse HEAD)}"
          git tag "$TAG" "$TARGET"
          # Atomic: the previous release left an orphan tag on origin because
          # the branch push was rejected after the tag push had already landed.
          git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "$TAG"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Dry-run version
        if: ${{ inputs.dry_run }}
        id: dryrun
        shell: bash
        env:
          RELEASE_SOURCE: ${{ inputs.release_source }}
          RESOLVED_VERSION: ${{ steps.resolve.outputs.version }}
          PREVIEW_COMMIT: ${{ steps.resolve.outputs.preview_commit }}
        run: |
          if [ "$RELEASE_SOURCE" = "preview" ]; then
            # The build jobs stamp the promoted version into this same commit,
            # so the artifacts a promotion dry run validates carry it too.
            VERSION="$RESOLVED_VERSION"
          else
            # Nothing stamps a release-from-main dry run, so the artifacts carry
            # the version already committed here.
            VERSION=$(node -p "require('./apps/review-desktop/package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=${PREVIEW_COMMIT:-$(git rev-parse HEAD)}" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "Whiteboard ${{ steps.bump.outputs.version }}" \
            --draft \
            --generate-notes

  npm:
    name: Publish npm package
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Install build dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve dist-tag and publication state
        id: npm
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DIST_TAG=$(node scripts/review-cli-release.mjs dist-tag "$VERSION")
          if PUBLISHED=$(node scripts/review-cli-release.mjs published "$VERSION" "$COMMIT"); then
            :
          elif [ "$DRY_RUN" = true ]; then
            echo "::warning::@dev.fast/whiteboard@${VERSION} exists on npm from another commit, or the registry check failed (see above); this dry run skips publish validation."
            PUBLISHED=true
          else
            exit 1
          fi
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
      - name: Build release tarball
        run: |
          jq -n --arg version "$VERSION" --arg commit "$COMMIT" '{$version, $commit}' > release-plan.json
          node scripts/pack-review-cli.mjs release-artifacts
      - name: Test installed tarball without Desktop
        run: node scripts/smoke-review-cli.mjs "release-artifacts/dev.fast-whiteboard-${VERSION}.tgz" "$VERSION"
      - name: Validate npm publish command
        if: ${{ steps.npm.outputs.published != 'true' }}
        env:
          DIST_TAG: ${{ steps.npm.outputs.dist_tag }}
        run: npm publish "./release-artifacts/dev.fast-whiteboard-${VERSION}.tgz" --dry-run --registry=https://registry.npmjs.org --access public --tag "$DIST_TAG" --ignore-scripts
      - name: Retain tested package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whiteboard-npm-${{ env.VERSION }}
          path: release-artifacts/*.tgz
          if-no-files-found: error
      - name: Publish tested package
        if: ${{ !inputs.dry_run && steps.npm.outputs.published != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.npm.outputs.dist_tag }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo 'NPM_TOKEN secret is missing.' >&2; exit 1; }
          npm publish "./release-artifacts/dev.fast-whiteboard-${VERSION}.tgz" --registry=https://registry.npmjs.org --access public --tag "$DIST_TAG" --provenance --ignore-scripts

  linux:
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    needs: [version, npm]
    uses: ./.github/workflows/review-linux-build.yml
    with:
      commit: ${{ needs.version.outputs.commit }}
      version: ${{ needs.version.outputs.version }}
      release_signing: ${{ !inputs.dry_run }}
    secrets: inherit

  # Signs even on a dry run, so the run validates exactly what would ship.
  windows:
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    needs: [version, npm]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/review-windows-build.yml
    with:
      commit: ${{ needs.version.outputs.commit }}
      version: ${{ needs.version.outputs.version }}
      sign: true

  macos:
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'macos' }}
    needs: [version, npm]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/review-macos-build.yml
    with:
      commit: ${{ needs.version.outputs.commit }}
      version: ${{ needs.version.outputs.version }}
      channel: stable
    secrets: inherit

  validate:
    name: Validate selected platforms
    needs: [version, macos, linux, windows]
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    env:
      PLATFORMS: ${{ inputs.platforms }}
      macos: ${{ needs.macos.result }}
      linux: ${{ needs.linux.result }}
      windows: ${{ needs.windows.result }}
    steps:
      - name: Require every selected build and validation
        run: |
          for platform in macos linux windows; do
            if [ "$PLATFORMS" = all ] || [ "$PLATFORMS" = "$platform" ]; then
              result="${!platform}"
              if [ "$result" != success ]; then
                echo "::error::${platform} build and validation: ${result}"
                exit 1
              fi
            fi
          done

  publish-macos:
    name: Publish macOS
    # Nothing publishes until every selected platform has built and validated.
    needs: [version, validate]
    if: ${{ !cancelled() && needs.validate.result == 'success' && !inputs.dry_run && (inputs.platforms == 'all' || inputs.platforms == 'macos') }}
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: warn
          pattern: macos-*
          path: dist

      # Payloads first, manifests last: a client must never see a latest.json
      # whose zip is not yet downloadable, on either arch.
      - name: Upload release to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          AWS_REGION: auto
          R2_BUCKET: ${{ vars.R2_RELEASE_BUCKET }}
        run: |
          # The releases/latest/ key is version-free by design, so the version
          # rides along in the filename a client saves the download as, with the
          # arch so Apple silicon and Intel downloads are told apart.
          for dir in dist/macos-*; do
            target="${dir#dist/macos-}"
            DMG_DISPOSITION="attachment; filename=\"df-whiteboard-${RELEASE_VERSION}-${target#darwin-}.dmg\""
            RELEASE_PREFIX="s3://${R2_BUCKET}/releases/${RELEASE_VERSION}/${target}"
            for zip in "$dir"/*-"${target}"-"${RELEASE_VERSION}".zip; do
              aws s3 cp "$zip" "${RELEASE_PREFIX}/$(basename "$zip")" \
                --content-type application/zip
            done
            aws s3 cp "$dir/Whiteboard-${target}-${RELEASE_VERSION}.dmg" \
              "${RELEASE_PREFIX}/Whiteboard-${target}-${RELEASE_VERSION}.dmg" \
              --content-type application/x-apple-diskimage \
              --content-disposition "$DMG_DISPOSITION"
            aws s3 cp "$dir/Whiteboard-${target}-${RELEASE_VERSION}.dmg" \
              "s3://${R2_BUCKET}/releases/latest/${target}/Whiteboard.dmg" \
              --content-type application/x-apple-diskimage \
              --content-disposition "$DMG_DISPOSITION"
          done

          for dir in dist/macos-*; do
            target="${dir#dist/macos-}"
            aws s3 cp "$dir/latest.json" \
              "s3://${R2_BUCKET}/update/stable/${target}/latest.json" \
              --content-type application/json
          done

      - name: Verify update feed
        run: |
          echo "Feed for an outdated client (expect 200 with ${RELEASE_VERSION}):"
          RESPONSE=$(curl -sf "https://update.dev.fast/api/update/darwin-arm64/stable/0000000000000000000000000000000000000000")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -F "\"productVersion\":\"${RELEASE_VERSION}\""
          echo "$RESPONSE" | grep -F "\"version\":\"${RELEASE_COMMIT}\""
          echo "$RESPONSE" | grep -F "/Review-darwin-arm64-${RELEASE_VERSION}.zip"

          echo "Feed for a Whiteboard.app install (expect the Whiteboard zip):"
          curl -sf "https://update.dev.fast/api/update/darwin-arm64/stable/0000000000000000000000000000000000000000?bundle=Whiteboard" \
            | grep -F "/Whiteboard-darwin-arm64-${RELEASE_VERSION}.zip"

          echo "Feed for the just-released commit (expect 204):"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://update.dev.fast/api/update/darwin-arm64/stable/${RELEASE_COMMIT}")
          echo "$STATUS"
          test "$STATUS" = "204"

          echo "Intel feed (clients send plain darwin):"
          curl -sf "https://update.dev.fast/api/update/darwin/stable/0000000000000000000000000000000000000000?bundle=Whiteboard" \
            | grep -F "/Whiteboard-darwin-x64-${RELEASE_VERSION}.zip"
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://update.dev.fast/api/update/darwin/stable/${RELEASE_COMMIT}")" = 204

      - name: Verify install landing
        run: |
          echo "install.dev.fast (expect 302 to the disk image):"
          LOCATION=$(curl -s -o /dev/null -w "%{redirect_url}" https://install.dev.fast/)
          echo "$LOCATION"
          test "$LOCATION" = "https://install.dev.fast/releases/latest/darwin-arm64/Whiteboard.dmg"

          echo "Following it (expect 200 and a disk image):"
          curl -sfL -o /dev/null -w "%{http_code} %{content_type}\n" https://install.dev.fast/ \
            | grep -F "200 application/x-apple-diskimage"

          echo "Intel disk image (expect a disk image):"
          curl -sfI https://install.dev.fast/releases/latest/darwin-x64/Whiteboard.dmg | grep -i "content-type: application/x-apple-diskimage"

      - name: Attach DMGs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            dist/macos-*/Whiteboard-*-"${RELEASE_VERSION}".dmg

  publish-linux:
    name: Publish Linux repositories
    needs: [version, validate]
    if: ${{ !cancelled() && needs.validate.result == 'success' && !inputs.dry_run && (inputs.platforms == 'all' || inputs.platforms == 'linux') }}
    uses: ./.github/workflows/review-linux-publish.yml
    with:
      channel: stable
      release_tag: ${{ needs.version.outputs.tag }}
    secrets: inherit

  publish-windows:
    name: Publish Windows installers
    environment: review-release
    needs: [version, validate]
    if: ${{ !cancelled() && needs.validate.result == 'success' && !inputs.dry_run && (inputs.platforms == 'all' || inputs.platforms == 'windows') }}
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-packages
          path: windows-packages
          digest-mismatch: warn
      - name: Name the installers for this release
        run: |
          mkdir windows-release
          cp windows-packages/Whiteboard-win32-x64-user.exe "windows-release/Whiteboard-${RELEASE_VERSION}-Setup.exe"
          cp windows-packages/Whiteboard-win32-x64-system.exe "windows-release/Whiteboard-${RELEASE_VERSION}-System-Setup.exe"
          cp windows-packages/Whiteboard-win32-x64.zip "windows-release/Whiteboard-win32-x64-${RELEASE_VERSION}.zip"
      # Versioned payloads first, then the alias install.dev.fast/windows serves.
      - name: Upload release to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          AWS_REGION: auto
          R2_BUCKET: ${{ vars.R2_RELEASE_BUCKET }}
        run: |
          RELEASE_PREFIX="s3://${R2_BUCKET}/releases/${RELEASE_VERSION}/win32-x64"
          for file in windows-release/*.exe; do
            aws s3 cp "$file" "${RELEASE_PREFIX}/$(basename "$file")" \
              --content-type application/vnd.microsoft.portable-executable \
              --content-disposition "attachment; filename=\"$(basename "$file")\""
          done
          aws s3 cp "windows-release/Whiteboard-win32-x64-${RELEASE_VERSION}.zip" \
            "${RELEASE_PREFIX}/Whiteboard-win32-x64-${RELEASE_VERSION}.zip" \
            --content-type application/zip
          aws s3 cp "windows-release/Whiteboard-${RELEASE_VERSION}-Setup.exe" \
            "s3://${R2_BUCKET}/releases/latest/win32-x64/Whiteboard-Setup.exe" \
            --content-type application/vnd.microsoft.portable-executable \
            --content-disposition "attachment; filename=\"Whiteboard-${RELEASE_VERSION}-Setup.exe\""
      - name: Verify install landing
        run: |
          echo "install.dev.fast/windows (expect 302 to the installer):"
          LOCATION=$(curl -s -o /dev/null -w "%{redirect_url}" https://install.dev.fast/windows)
          echo "$LOCATION"
          test "$LOCATION" = "https://install.dev.fast/releases/latest/win32-x64/Whiteboard-Setup.exe"

          echo "Following it (expect 200 and a Windows executable):"
          curl -sfL -o /dev/null -w "%{http_code} %{content_type}\n" https://install.dev.fast/windows \
            | grep -F "200 application/vnd.microsoft.portable-executable"
      - name: Attach installers to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" windows-release/*

  finalize-release:
    name: Publish release
    needs: [version, publish-macos, publish-linux, publish-windows]
    if: ${{ !cancelled() && !inputs.dry_run && needs.version.result == 'success' && (inputs.platforms != 'all' && inputs.platforms != 'macos' || needs.publish-macos.result == 'success') && (inputs.platforms != 'all' && inputs.platforms != 'linux' || needs.publish-linux.result == 'success') && (inputs.platforms != 'all' && inputs.platforms != 'windows' || needs.publish-windows.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --draft=false
