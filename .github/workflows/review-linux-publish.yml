name: Whiteboard Linux publication

on:
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      release_tag:
        type: string
        default: ""
      artifact_name:
        type: string
        default: linux-packages

permissions:
  contents: write

jobs:
  upload:
    name: Upload Linux (${{ matrix.format }})
    runs-on: ubuntu-latest
    environment: review-release
    strategy:
      fail-fast: false
      matrix:
        format: [rpm, deb, arch]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: linux-packages
      - name: Upload immutable repository objects
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          AWS_REGION: auto
          R2_BUCKET: ${{ vars.R2_RELEASE_BUCKET }}
          CHANNEL: ${{ inputs.channel }}
          FORMAT: ${{ matrix.format }}
        run: |
          mkdir linux-repository
          tar --zstd -xf linux-packages/linux-publication.tar.zst -C linux-repository
          python3 apps/review-desktop/scripts/publish-linux-repository.py \
            --directory linux-repository --bucket "$R2_BUCKET" --channel "$CHANNEL" --upload-format "$FORMAT"
      - name: Attach packages to draft release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          FORMAT: ${{ matrix.format }}
        run: |
          case "$FORMAT" in
            rpm) files=(linux-packages/*.rpm) ;;
            deb) files=(linux-packages/*.deb) ;;
            arch) files=(linux-packages/*.pkg.tar.zst linux-packages/*.pkg.tar.zst.sig) ;;
          esac
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${files[@]}"

  promote:
    name: Promote Linux repositories
    needs: upload
    runs-on: ubuntu-latest
    environment: review-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: linux-packages
      - name: Verify uploads and promote the shared pointer
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          AWS_REGION: auto
          R2_BUCKET: ${{ vars.R2_RELEASE_BUCKET }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          mkdir linux-repository
          tar --zstd -xf linux-packages/linux-publication.tar.zst -C linux-repository
          python3 apps/review-desktop/scripts/publish-linux-repository.py \
            --directory linux-repository --bucket "$R2_BUCKET" --channel "$CHANNEL" --promote-only
          if [ "$CHANNEL" = preview ]; then
            curl -fsS https://install.dev.fast/repos/whiteboard-preview.repo | grep -F 'baseurl=https://install.dev.fast/repos/preview/rpm/x86_64/'
            curl -fsSI https://install.dev.fast/repos/preview/arch/x86_64/whiteboard-preview.db | grep -q '^HTTP/[0-9.]* 302'
          fi
