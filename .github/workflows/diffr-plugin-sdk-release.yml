name: Diffr Plugin SDK Release

on:
  push:
    tags:
      - "diffr-plugin-sdk/[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: diffr-plugin-sdk-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish SDK
    environment: review-release-approval
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: diffr
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("crates/diffr-plugin-sdk/Cargo.toml", "rb"))["package"]["version"])')
          test "$GITHUB_REF_NAME" = "diffr-plugin-sdk/$version"
          git merge-base --is-ancestor HEAD origin/main
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Publish SDK
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p diffr-plugin-sdk
